[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waffle-eda"
version = "0.0.1"
description = "Feature proposal to manufacturable design files, with no interactive routing."
requires-python = ">=3.11"
dependencies = [
    "z3-solver",
    "numpy",
    "shapely",
]

[project.optional-dependencies]
dev = ["pytest"]

# KiCad 9's `pcbnew` module is not on PyPI: it comes with the KiCad installation and must be importable by this
# interpreter. scripts/check_env.py verifies that.

[tool.setuptools.packages.find]
include = ["waffle_eda*"]

[tool.setuptools.package-data]
"waffle_eda.fab" = ["profiles/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The parked classes' tests (BGA escape, bus plan, bus routing: B+ and C) stay out of a session's run until
# their class is reached (docs/plan.md, D55); `pytest -m parked` runs them. Durations show where the time goes.
addopts = "-m 'not parked' --durations=10"
markers = [
    "parked: class B+/C machinery, not run until its class is reached",
    "bench: the benchmark's sanity pair on the class B boards, minutes each; `-m 'not parked and not bench'` for a quick run",
]
