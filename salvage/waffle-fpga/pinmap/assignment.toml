# waffle-fpga — FPGA pin assignment: SINGLE SOURCE OF TRUTH
#
# Edit this file, then run  python3 pinmap/gen_pinmap.py  to regenerate
#   pinmap.csv, board.lpf and bank-summary.md  (the generator also validates
#   every claim below against the prjtrellis ECP5 pin database in pinmap/db/).
#
# Conventions
#   b   = ball of the signal (for a differential signal: the TRUE/positive ball)
#   nb  = ball of the complement (negative) side of a differential pair
#   d   = direction seen from the FPGA: in | out | bidir
#   t   = IO_TYPE for the LPF (overrides the interface default)
#   a   = extra LPF attributes (overrides the interface default)
#   clk = external clock frequency in Hz (adds FREQUENCY PORT; must sit on a
#         PCLK/GR_PCLK primary-clock ball)
#   dqs = DDR3 role: dq | dm | dqs | addr | cmd | ctrl | ck | reset
#   lane= DDR3 byte lane (0/1) for dq/dm/dqs
#   note= free text copied into the CSV
#
# Ball naming/availability rules enforced by the generator:
#   * every ball must exist on LFE5U-85F, -45F and -25F in caBGA381 unless the
#     signal carries  only85 = true  (then it is documented as NC on smaller parts)
#   * bank voltage must match the IO_TYPE of every signal in the bank
#   * differential pairs must be a real A/B or C/D pad pair of one PIO tile,
#     positive side on A (or C); C/D pairs and differential inputs are only
#     legal on left/right banks (2,3,6,7)
#   * DDR3 dq/dm must be in the DQS group of their lane's dqs ball; dqs must
#     sit on the dedicated DQS/DQSN pads; VREF1 of a DQ bank is reserved

[package]
device      = "LFE5U-85F-8BG381C"
alternates  = ["LFE5U-45F-8BG381C", "LFE5U-25F-8BG381C"]
package     = "CABGA381"
speed_grade = "-8"   # session 2: -8 for HDMI 720p60 (742.5 Mb/s) and DDR3L 800 MT/s in spec

# Package orientation assumed for all "board_side" remarks (top view of the
# assembled board, front edge = HDMI/USB-host/audio edge, toward the viewer):
#   The package is rotated 180 degrees from the Lattice top-view pinout
#   drawing, i.e. ball A1 is at the FRONT-RIGHT corner of the package.
#   Row A faces the front edge, column 20 is on the left, column 1 on the
#   right.  Consequently:
#     bank 1 = front-left top edge     bank 0 = front-right top edge
#     bank 2 = left side, front half   bank 3 = left side, back half
#     bank 7 = right side, front half  bank 6 = right side, back half
#     bank 8 + dedicated config/JTAG   = back-right corner (rows R..Y, cols 1..5)
orientation = "A1 at front-right; row A = front edge; banks 2/3 left, 6/7 right, 8 back-right"

[banks.0]
vccio = 3.3
board_side = "top edge, front-right"
role = "microSD x2, ESP32-C6 SDIO, I2C (low speed, single ended)"

[banks.1]
vccio = 3.3
board_side = "top edge, front-left"
role = "STM32H743 FMC bus + 3 expansion-header pins"

[banks.2]
vccio = 1.35
board_side = "left side, front half"
role = "DDR3L address/command/control/clock (+ reserved 2nd-rank CK1/CS1)"

[banks.3]
vccio = 1.35
board_side = "left side, back half"
role = "DDR3L data: DQ, DQS, DM, pseudo-power pads (VREF1_3 = P16 reserved)"

[banks.6]
vccio = 3.3
board_side = "right side, back half"
role = "PMOD C/D (true pairs), 2x20 expansion header (16 pins)"

[banks.7]
vccio = 3.3
board_side = "right side, front half"
role = "HDMI TMDS (A/B pairs), PMOD A/B (pairs), clocks, I2S, 1 header pin"

[banks.8]
vccio = 3.3
board_side = "back-right corner (sysCONFIG bank)"
role = "QSPI configuration flash, 74HC595 LED shift register (3), 5 expansion-header pins on D[7:4]/WRITEN"

# ---------------------------------------------------------------------------
# Dedicated (non-PIO) pins.  Not in the prjtrellis I/O database; ball numbers
# taken from the ULX3S KiCad symbol for LFE5UM-85F-6BG381C (emard/ulx3s,
# ulx3s-cache.lib) and cross-checked against the sysCONFIG guide pin names.
# Re-verify against the Lattice caBGA381 pinout CSV before the schematic.
# ---------------------------------------------------------------------------

[dedicated_pins]
pins = [
  { name = "TCK", ball = "T5", d = "in", iface = "config", note = "JTAG clock from FT2232H (VCCIO8 = 3.3 V)" },
  { name = "TMS", ball = "U5", d = "in", iface = "config", note = "JTAG mode select" },
  { name = "TDI", ball = "R5", d = "in", iface = "config", note = "JTAG data in" },
  { name = "TDO", ball = "V4", d = "out", iface = "config", note = "JTAG data out" },
  { name = "PROGRAMN", ball = "W3", d = "in", iface = "config", note = "PROGRAMN push button, 4.7k pull-up to VCCIO8" },
  { name = "INITN", ball = "V3", d = "bidir", iface = "config", note = "open-drain, INITN LED (active low) + pull-up" },
  { name = "DONE", ball = "Y3", d = "bidir", iface = "config", note = "open-drain, DONE LED + pull-up" },
  { name = "CCLK", ball = "U3", d = "out", iface = "config", note = "MCLK to flash SCK (Master SPI), 1k pull-up recommended, user-mode via USRMCLK" },
  { name = "CFG0", ball = "U4", d = "in", iface = "config", note = "CFG[2:0]=010 = Master SPI: CFG0 pull-DOWN" },
  { name = "CFG1", ball = "T4", d = "in", iface = "config", note = "CFG1 pull-UP (4.7k)" },
  { name = "CFG2", ball = "R4", d = "in", iface = "config", note = "CFG2 pull-DOWN" },
]

# ---------------------------------------------------------------------------
# Interfaces (order = order in the CSV / LPF)
# ---------------------------------------------------------------------------

