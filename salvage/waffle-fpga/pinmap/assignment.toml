[interfaces.hdmi]
title   = "HDMI 1.4 TMDS source, 4 pseudo-differential pairs direct from FPGA (bank 6, 3.3 V); design target 720p60 / 1080p30, 1080p60 best-effort"
io_type = "LVCMOS33D"
attrs   = "DRIVE=4 SLEWRATE=FAST"
note    = "A/B pad pairs on the right side, back half (GDDRX2/ECLK, 800 Mb/s on -8). Series resistors + optional AC coupling per the ULX3S GPDI circuit. HPD, DDC and CEC are on the STM32H7 (stm32-pin-plan.md)."
signals = [
  # D52: moved from bank 7 (front half of the right side) to bank 6 (back half) so the connector can sit on the back edge
  { n="hdmi_clk_p", b="L4", nb="L5", d="out", note="TMDS clock pair" },
  { n="hdmi_d0_p",  b="N4", nb="P5", d="out", note="TMDS data 0 (blue)" },
  { n="hdmi_d1_p",  b="L3", nb="L2", d="out", note="TMDS data 1 (green)" },
  { n="hdmi_d2_p",  b="L1", nb="N1", d="out", note="TMDS data 2 (red)" },
]

[interfaces.clocks]
title   = "Primary clock inputs (bank 7 PCLK pads)"
io_type = "LVCMOS33"
attrs   = "PULLMODE=NONE"
signals = [
  { n="clk27",     b="F2", d="in", clk=27000000, note="27 MHz main oscillator on PCLKT7_0. Reaches every PLL (UL/UR/LL/LR on 85F/45F; LL/LR on 25F) through the primary clock network; nearest = UL" },
  { n="clk_si5351", b="G3", d="in", clk=25000000, note="Si5351A CLK0 on PCLKT7_1 (frequency programmable; 25 MHz placeholder in FREQUENCY constraint)" },
]

[interfaces.i2s]
title   = "I2S to TLV320AIC3204 codec (bank 7)"
io_type = "LVCMOS33"
attrs   = "SLEWRATE=SLOW"
signals = [
  { n="i2s_mclk",  b="H5", d="in",  clk=12288000, a="PULLMODE=NONE", note="MCLK from Si5351A CLK1 on GR_PCLK7_0 (usable as a primary clock)" },
  { n="i2s_bclk",  b="H4", d="out", note="on GR_PCLK7_1 so it can also be a clock INPUT if the codec is bus master" },
  { n="i2s_lrclk", b="G5", d="out" },
  { n="i2s_dout",  b="F3", d="out", note="FPGA -> codec DAC data (on PCLKC7_1, spare clock-capable pad)" },
  { n="i2s_din",   b="H3", d="in",  note="codec ADC -> FPGA" },
]

[interfaces.pmod_a]
title   = "PMOD A (bank 7, 4 differential-capable pad pairs)"
io_type = "LVCMOS33"
attrs   = "DRIVE=8 SLEWRATE=SLOW"
note    = "Pairs map to PMOD pins (1,7) (2,8) (3,9) (4,10) per PMOD spec 1.3.1. True differential RX; output pairs as LVCMOS33D (emulated)."
signals = [
  { n="pmod_a[0]", b="A4", d="bidir", pair="A5", note="PMOD pin 1 (+) ; pair A/B, ULC_GPLL0T_IN dual-function" },
  { n="pmod_a[4]", b="A5", d="bidir", pair="A4", note="PMOD pin 7 (-)" },
  { n="pmod_a[1]", b="E4", d="bidir", pair="D5", note="PMOD pin 2 (+) ; pair A/B" },
  { n="pmod_a[5]", b="D5", d="bidir", pair="E4", note="PMOD pin 8 (-)" },
  { n="pmod_a[2]", b="B5", d="bidir", pair="C5", note="PMOD pin 3 (+) ; pair C/D" },
  { n="pmod_a[6]", b="C5", d="bidir", pair="B5", note="PMOD pin 9 (-)" },
  { n="pmod_a[3]", b="A3", d="bidir", pair="B3", note="PMOD pin 4 (+) ; pair C/D" },
  { n="pmod_a[7]", b="B3", d="bidir", pair="A3", note="PMOD pin 10 (-)" },
]

[interfaces.pmod_b]
title   = "PMOD B (bank 7, 4 differential-capable pad pairs)"
io_type = "LVCMOS33"
attrs   = "DRIVE=8 SLEWRATE=SLOW"
signals = [
  { n="pmod_b[0]", b="C3", d="bidir", pair="D3", note="PMOD pin 1 (+) ; pair C/D" },
  { n="pmod_b[4]", b="D3", d="bidir", pair="C3", note="PMOD pin 7 (-)" },
