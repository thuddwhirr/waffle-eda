  # ---- byte lane 1 : DQS group RDQS53 (bank 3) ----
  { n="ddr3_dq[8]",    b="P18", d="bidir", a="SLEWRATE=FAST TERMINATION=75", dqs="dq",  lane=1 },
  { n="ddr3_dq[9]",    b="P19", d="bidir", a="SLEWRATE=FAST TERMINATION=75", dqs="dq",  lane=1 },
  { n="ddr3_dq[10]",   b="P20", d="bidir", a="SLEWRATE=FAST TERMINATION=75", dqs="dq",  lane=1 },
