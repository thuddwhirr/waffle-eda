  { n="ddr3_a[6]",  b="E16", d="out", dqs="addr" },
  { n="ddr3_a[7]",  b="D19", d="out", dqs="addr" },
  { n="ddr3_a[8]",  b="C18", d="out", dqs="addr" },
  { n="ddr3_a[9]",  b="E18", d="out", dqs="addr" },
