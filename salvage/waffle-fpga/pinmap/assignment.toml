"A15" = "bank 1 — NOT BONDED on LFE5U-25F: leave unconnected (optional 85F/45F-only test point)"
"C9"  = "bank 0 — NOT BONDED on LFE5U-25F: leave unconnected"
"D10" = "bank 0 — NOT BONDED on LFE5U-25F: leave unconnected"
"E10" = "bank 0 — NOT BONDED on LFE5U-25F: leave unconnected"
