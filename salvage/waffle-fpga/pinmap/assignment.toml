  { n="ddr3_dq[15]",   b="U19", d="bidir", a="SLEWRATE=FAST TERMINATION=75", dqs="dq",  lane=1 },
  { n="ddr3_dm[1]",    b="N20", d="out",   dqs="dm",  lane=1 },
  { n="ddr3_dqs_p[1]", b="T19", nb="R18", d="bidir", t="SSTL135D_I", a="SLEWRATE=FAST TERMINATION=OFF DIFFRESISTOR=100", dqs="dqs", lane=1, note="DQS pads N16/M17 (RDQS53/RDQSN53)" },
  # ---- address / command / control / clock : bank 2 ----
