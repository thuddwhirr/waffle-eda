  { n="pmod_b[5]", b="F5", d="bidir", pair="E5", note="PMOD pin 8 (-)" },
  { n="pmod_b[2]", b="B2", d="bidir", pair="C2", note="PMOD pin 3 (+) ; pair C/D ; B2 is VREF1_7 (free: no referenced inputs in bank 7)" },
