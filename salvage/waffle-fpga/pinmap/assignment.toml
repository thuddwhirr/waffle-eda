  { n="ddr3_dq[1]",    b="N18", d="bidir", a="SLEWRATE=FAST TERMINATION=75", dqs="dq",  lane=0 },
  { n="ddr3_dq[2]",    b="P17", d="bidir", a="SLEWRATE=FAST TERMINATION=75", dqs="dq",  lane=0 },
  { n="ddr3_dq[3]",    b="N17", d="bidir", a="SLEWRATE=FAST TERMINATION=75", dqs="dq",  lane=0 },
  { n="ddr3_dq[4]",    b="L17", d="bidir", a="SLEWRATE=FAST TERMINATION=75", dqs="dq",  lane=0 },
