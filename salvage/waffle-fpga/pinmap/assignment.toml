  { n="ext[26]", b="T3", d="bidir", a="DRIVE=8 SLEWRATE=SLOW PULLMODE=UP", note="WRITEN — weak pull-up during configuration; header must not pull it low (low = 0xFF quad-reset preamble, harmless but avoid)" },
]

