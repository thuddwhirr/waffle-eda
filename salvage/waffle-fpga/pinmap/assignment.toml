[spares]
# 1.35 V spares (DDR3 banks) — only usable for SSTL135-level signals; test points
"D20" = "bank 2 VREF1_2 — kept free (VREF-capable) so bank 2 could take referenced inputs later; test point"
"K16" = "bank 2, RDQS29 pad — NOT BONDED on LFE5U-45F/25F: leave unconnected"
"K17" = "bank 2, RDQSN29 pad — NOT BONDED on LFE5U-45F/25F: leave unconnected"
"U16" = "bank 3 spare, LRC_GPLL0T_IN (dedicated lower-right PLL input, all 3 parts) — 1.35 V bank"
"T17" = "bank 3 spare, LRC_GPLL0C_IN"
"L20" = "bank 3 spare in RDQS53 group, PCLKT3_1"
"M20" = "bank 3 spare in RDQS53 group, PCLKC3_1"
"M19" = "bank 3 spare in RDQS53 group, PCLKC3_0"
"T16" = "bank 3, RDQS77 pad — NOT BONDED on LFE5U-25F: leave unconnected"
